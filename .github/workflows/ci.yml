name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Verify modules
        run: go mod verify
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            label: x86_64
          - goarch: arm64
            label: aarch64
    name: build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -o build/vc-linux-${{ matrix.goarch }} ./cmd/vc
      - name: Smoke
        if: matrix.goarch == 'amd64'
        run: |
          ./build/vc-linux-amd64 version
          ./build/vc-linux-amd64 server --help
      - uses: actions/upload-artifact@v4
        with:
          name: vc-linux-${{ matrix.goarch }}
          path: build/vc-linux-${{ matrix.goarch }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test ./...

  # Tag + GitHub Release only after lint/build/test succeed on a release branch
  # or an x.y.z tag. Publish stays in this workflow because tag pushes made with
  # GITHUB_TOKEN do not start a second workflow run.
  release:
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/')
      )
    needs: [lint, build, test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            raw="${GITHUB_REF_NAME#release/}"
            create_tag=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            raw="$GITHUB_REF_NAME"
            create_tag=false
          else
            echo "error: unexpected ref $GITHUB_REF" >&2
            exit 1
          fi
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid version '$raw' (expected x.y.z)" >&2
            exit 1
          fi
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          echo "tag=${raw}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${create_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag ${raw} (create_tag=${create_tag})"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; leaving it in place"
            exit 0
          fi
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
