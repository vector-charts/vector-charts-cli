name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        run: go build -o /tmp/vc ./cmd/vc
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Smoke
        run: |
          /tmp/vc version
          /tmp/vc server --help
